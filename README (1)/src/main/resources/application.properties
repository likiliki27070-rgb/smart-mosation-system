# Server Port Configuration
server.port=8080

# ===================================================================
# OPTION 1: H2 In-Memory Database (Default for instant setup/demo)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:drowsiness_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# OPTION 2: MySQL Database Setup (Uncomment to use MySQL)
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/drowsiness_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA Common Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow H2 console frames in Spring Security (if security is added later, or just general compatibility)
spring.headers.frame-options=sameorigin
